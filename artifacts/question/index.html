<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wheel-post-reads" content="question.json">
<title>Question</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7;
    --accent: #0a60d6; --accent-text: #ffffff; --accent-bg: #e8f0fd; --error: #b3261e; --ok: #1a7f37; --focus: #0a60d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --surface: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6; --line: #48484a;
      --accent: #4c9bff; --accent-text: #0b0b0c; --accent-bg: #1c3558; --error: #ff8f87; --ok: #5fd37f; --focus: #4c9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, system-ui, sans-serif; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  #prompt { margin: 0 0 16px; font-size: 16px; font-weight: 600; white-space: pre-wrap; }
  #options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  #options button { all: unset; cursor: pointer; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; }
  #options button:hover { background: var(--accent-bg); }
  #options button[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); font-weight: 600; }
  textarea { display: block; width: 100%; min-height: 72px; resize: vertical; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  button.primary { all: unset; cursor: pointer; padding: 7px 16px; border-radius: 8px; background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .status { color: var(--muted); font-size: 12px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--error); }
  [hidden] { display: none !important; }
</style>
<main>
  <p id="prompt">Loading…</p>
  <div id="options" role="group" aria-label="Options" hidden></div>
  <textarea id="text" aria-label="Your answer" hidden></textarea>
  <div class="row">
    <button class="primary" id="send" type="button" disabled>Send</button>
    <span class="status" id="status"></span>
  </div>
</main>
<script src=".wheel/client.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let choice = null;
  let withOptions = false;
  function status(text, kind) { $("status").textContent = text; $("status").className = "status " + (kind || ""); }
  function refresh() { $("send").disabled = withOptions ? choice === null : !$("text").value.trim(); }
  async function load() {
    let question;
    try {
      const response = await fetch("data/question.json");
      if (!response.ok) throw new Error("data/question.json answered " + response.status);
      question = await response.json();
    } catch (e) {
      $("prompt").textContent = "This page draws a post holding question.json: " + e.message;
      return;
    }
    $("prompt").textContent = question.prompt || "";
    withOptions = Array.isArray(question.options) && question.options.length > 0;
    if (withOptions) {
      for (const option of question.options) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = option;
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => {
          choice = option;
          for (const b of $("options").children) b.setAttribute("aria-pressed", String(b === button));
          refresh();
        });
        $("options").append(button);
      }
      $("options").hidden = false;
      $("text").placeholder = "Note (optional)";
      $("text").setAttribute("aria-label", "Note");
    } else {
      $("text").placeholder = "Your answer";
    }
    $("text").hidden = false;
    $("text").addEventListener("input", refresh);
    refresh();
  }
  $("send").addEventListener("click", async () => {
    const value = {};
    const typed = $("text").value.trim();
    if (withOptions) {
      value.choice = choice;
      if (typed) value.note = typed;
    } else {
      value.text = typed;
    }
    $("send").disabled = true;
    try {
      await window.wheel.set("answer", value);
      status("Sent", "ok");
    } catch (e) {
      status(e.message, "bad");
      refresh();
    }
  });
  load();
</script>
