<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wheel-post-reads" content="index.md">
<title>Markdown</title>
<link rel="stylesheet" href=".wheel/wheel.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--label); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 900px; width: 100%; margin: 0 auto; overflow-wrap: anywhere; }
  main > :first-child { margin-top: 0; }
  h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.6em 0 0.5em; }
  h1 { font-size: 22px; margin-top: 0; }
  h2 { font-size: 18px; }
  h3 { font-size: 16px; }
  h4, h5, h6 { font-size: 14px; }
  h6 { color: var(--secondary); }
  p, ul, ol, blockquote, pre, table { margin: 0 0 10px; }
  ul, ol { padding-left: 22px; }
  li > ul, li > ol, li > p { margin: 4px 0 0; }
  hr { border: 0; border-top: 1px solid var(--separator); margin: 20px 0; }
  blockquote { padding: 2px 14px; border-left: 3px solid var(--separator-strong); color: var(--secondary); }
  blockquote > :last-child { margin-bottom: 0; }
  pre { padding: 10px 12px; background: var(--fill); border-radius: 8px; overflow-x: auto; }
  pre code { padding: 0; background: none; white-space: pre; }
  code { font: 13px ui-monospace, Menlo, monospace; background: var(--fill); padding: 1px 5px; border-radius: 4px; }
  table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
  th, td { padding: 6px 12px; border: 1px solid var(--separator); text-align: left; vertical-align: top; }
  th { background: var(--group); font-weight: 600; }
  del { color: var(--secondary); }
  a { color: var(--accent); }
  input[type="checkbox"] { margin: 0 6px 0 0; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .notice { padding: 14px 16px; border-radius: 10px; background: var(--red-fill); color: var(--red); border: 1px solid var(--red); }
  .notice.plain { background: var(--group); color: var(--secondary); border-color: var(--separator); }
  .thumb {
    display: inline-block; max-width: 100%; padding: 0; margin: 2px 0; border: 1px solid var(--separator); border-radius: 8px;
    background: var(--group); cursor: zoom-in; overflow: hidden; font: inherit; color: inherit; box-shadow: none; vertical-align: middle;
  }
  .thumb img { display: block; max-width: 100%; max-height: 480px; height: auto; }
</style>
<main id="root"><div class="notice plain">Waiting for the post…</div></main>
<script src=".wheel/client.js"></script>
<script src=".wheel/lightbox.js"></script>
<script src="marked.umd.js"></script>
<script>
(() => {
  const root = document.getElementById("root");
  let shown = null;
  let pushed = false;

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const dataUrl = (name) => "data/" + String(name).split("/").map(encodeURIComponent).join("/");

  // Where a link or image target goes: an http(s) address stays as written, a path with no scheme is
  // a file in the post's folder (served under data/), a #fragment stays on the page, and any other
  // scheme (javascript:, file:, data:) is refused.
  function target(raw) {
    const t = String(raw).trim();
    if (/^https?:\/\//i.test(t)) return { url: t, remote: true };
    if (t.startsWith("#")) return { url: t, anchor: true };
    if (/^[a-z][a-z0-9+.-]*:/i.test(t) || t.startsWith("//") || t.split(/[?#]/)[0].split("/").includes("..")) return null;
    const m = t.match(/^([^?#]*)(.*)$/);
    let path = m[1];
    while (path.startsWith("./")) path = path.slice(2);
    return path ? { url: dataUrl(path) + m[2] } : null;
  }

  // Markdown is drawn by marked (vendored beside this page as marked.umd.js). Raw HTML is shown as text,
  // a link or image whose target is refused is drawn as its text, and an image opens the lightbox.
  marked.use({
    gfm: true,
    renderer: {
      html({ text }) { return esc(text); },
      link({ href, tokens }) {
        const body = this.parser.parseInline(tokens);
        const t = target(href);
        return t && !t.anchor ? `<a href="${esc(t.url)}"${t.remote ? ' rel="noopener"' : ""}>${body}</a>` : body;
      },
      image({ href, text }) {
        const t = target(href);
        if (!t || t.anchor) return esc(text);
        return `<button type="button" class="thumb" data-lightbox data-src="${esc(t.url)}" data-cap="${esc(text)}"><img src="${esc(t.url)}" alt="${esc(text || href)}"></button>`;
      },
      code({ text, lang }) {
        const tag = (lang || "").match(/^[\w+-]+/);
        return `<pre><code${tag ? ` class="language-${esc(tag[0])}"` : ""}>${esc(text)}</code></pre>`;
      }
    }
  });

  function notice(message) {
    root.innerHTML = `<div class="notice" role="alert">${esc(message)}</div>`;
    if (window.wheelLightbox) wheelLightbox.close(true);
  }

  function accept(value) {
    if (typeof value !== "string") { notice("This post's markdown was replaced by something that is not text. Send it with `wheel artifact data <pane> index.md`."); return; }
    if (value === shown) return;
    shown = value;
    const reopen = window.wheelLightbox ? wheelLightbox.key() : null;
    if (!value.trim()) {
      root.innerHTML = `<div class="notice plain">This post has nothing to show yet.</div>`;
      document.title = "Markdown";
    } else {
      const tokens = marked.lexer(value);
      const heading = tokens.find((token) => token.type === "heading" && token.depth === 1);
      root.innerHTML = marked.parser(tokens);
      document.title = heading ? new DOMParser().parseFromString(marked.parseInline(heading.text), "text/html").body.textContent : "Markdown";
    }
    if (reopen && !wheelLightbox.show(reopen)) wheelLightbox.close(true);
  }

  fetch("data/index.md", { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error(r.status === 404 ? "there is no index.md in this post's folder." : "index.md answered " + r.status + ".");
      return r.text();
    })
    .then((text) => { if (!pushed) accept(text); })
    .catch((e) => { if (!pushed) notice("Cannot show the post: " + e.message); });

  // .wheel/client.js did not load: the post still shows, it just gets no live updates.
  if (window.wheel) window.wheel.onData((value) => { pushed = true; accept(value); });
})();
</script>
