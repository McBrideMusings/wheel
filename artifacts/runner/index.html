<!doctype html>
<!--
  Runner: one row per [runner] entry of this space's wheel.toml over this machine's, grouped by
  where each comes from. Run opens the command in a new terminal pane in this pane's space. The
  look is Wheel's design system, `.wheel/wheel.css`.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner</title>
<link rel="stylesheet" href=".wheel/wheel.css">
<style>
.runner { grid-template-columns: minmax(80px, max-content) minmax(0, 1fr) auto; height: var(--row-tall); }
.runner .name { font-weight: 600; }
.runner code { color: var(--secondary); }
#status { margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <h1>Runner</h1>
    <span class="sub one" id="sub">Loading…</span>
    <button id="reload" type="button">Reload</button>
  </div>
  <div id="list" aria-live="polite"></div>
  <div id="status" role="status"></div>
</main>
<script src=".wheel/client.js"></script>
<script>
  // One row per [runner] entry of this space's wheel.toml over this machine's. The page reaches
  // wheeld through wheel.run: listing pushes `wheel run --json` back to this pane as data, and Run
  // runs `wheel run --focus <name>`, which opens a terminal pane in this pane's space ($WHEEL_SPACE).
  const list = document.getElementById("list");
  const sub = document.getElementById("sub");
  const status = document.getElementById("status");

  // A problem shows as a notice under the list; anything else is the line beside the title.
  function say(text, error) {
    if (error) {
      status.className = "notice bad";
      status.textContent = text;
    } else {
      status.className = "";
      status.textContent = "";
      sub.textContent = text;
    }
  }

  function notice(html) {
    list.innerHTML = "";
    const p = document.createElement("p");
    p.className = "notice";
    p.innerHTML = html;
    list.append(p);
  }

  function checked() {
    return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  }

  function row(r) {
    const div = document.createElement("div");
    div.className = "row runner";
    const name = document.createElement("span");
    name.className = "name one";
    name.textContent = r.name;
    const command = document.createElement("code");
    command.className = "one";
    command.textContent = r.command;
    command.title = r.command;
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "Run";
    button.setAttribute("aria-label", "Run " + r.name);
    button.addEventListener("click", () => start(r.name, button));
    div.append(name, command, button);
    return div;
  }

  function draw(runners) {
    if (!Array.isArray(runners)) return;
    if (runners.length === 0) {
      notice('No runners yet. Add a <code>[runner]</code> table to this project\'s <code>wheel.toml</code>, such as <code>build = "make -j8"</code>; the list updates when you save.');
      say("No runners. Checked at " + checked() + ".");
      return;
    }
    say(runners.length + (runners.length === 1 ? " runner" : " runners") + ". Checked at " + checked() + ".");
    list.innerHTML = "";
    for (const [origin, title] of [["project", "This project"], ["machine", "This machine"]]) {
      const rows = runners.filter((r) => (r.origin === "machine") === (origin === "machine"));
      if (rows.length === 0) continue;
      const heading = document.createElement("div");
      heading.className = "heading";
      heading.textContent = title + " ";
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = rows.length;
      heading.append(n);
      const group = document.createElement("div");
      group.className = "group";
      group.append(...rows.map(row));
      list.append(heading, group);
    }
  }

  let listing = false;
  async function load() {
    if (listing) return;
    listing = true;
    try {
      const reply = await window.wheel.run({ command: 'wheel run --json | wheel artifact data "$WHEEL_PANE" -', cwd: "/" });
      if (reply.exit !== undefined && reply.exit !== 0) {
        notice("");
        say("Listing the runners failed (exit " + reply.exit + "):\n" + (reply.output || ""), true);
      }
    } catch (e) {
      say(String(e.message || e), true);
    } finally {
      listing = false;
    }
  }

  async function start(name, button) {
    button.disabled = true;
    say("Starting " + name + "…");
    try {
      const reply = await window.wheel.run({ command: 'wheel run --focus "$RUNNER"', cwd: "/", env: { RUNNER: name } });
      if (reply.exit !== undefined && reply.exit !== 0) {
        say(name + " did not start (exit " + reply.exit + "):\n" + (reply.output || ""), true);
      } else if (reply.running) {
        say(name + " is opening in a new terminal pane.");
      } else {
        say(name + " started in pane " + (reply.output || "").trim() + ".");
      }
    } catch (e) {
      say(String(e.message || e), true);
    } finally {
      button.disabled = false;
    }
  }

  if (window.wheel) {
    window.wheel.onData(draw);
    load();
  } else {
    notice("The page channel (.wheel/client.js) did not load, so this page cannot reach wheeld.");
  }
  document.getElementById("reload").addEventListener("click", load);
  // wheeld pushes the list again whenever either wheel.toml changes; listing again when the pane is
  // shown or clicked into covers a change it could not watch.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  window.addEventListener("focus", load);
</script>
</body>
</html>
