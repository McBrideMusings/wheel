[plugin]
id = "wheelhouse"
version = "0.1.0"

[backend]
command = "../../target/debug/wheelhouse backend"

[[pane]]
id = "beads"
title = "Beads"
script = "panes/beads.luau"
reads = ["wheelhouse.beads", "wheel.panes"]
actions = ["wheelhouse.press", "wheelhouse.run_list"]

[[pane]]
id = "repo"
title = "Repo"
script = "panes/repo.luau"
reads = ["wheelhouse.repo"]
actions = ["wheelhouse.branch_delete", "wheelhouse.run_list"]

[[pane]]
id = "diff"
title = "Diff"
script = "panes/diff.luau"
reads = ["wheelhouse.diff"]

[[pane]]
id = "prs"
title = "PRs"
script = "panes/prs.luau"
reads = ["wheelhouse.prs", "wheelhouse.pr_detail"]
actions = ["wheelhouse.pr_merge", "wheelhouse.pr_close", "wheelhouse.pr_draft", "wheelhouse.pr_checkout", "wheelhouse.pr_worktree", "wheelhouse.pr_button", "wheelhouse.pr_refresh", "wheelhouse.run_list"]
