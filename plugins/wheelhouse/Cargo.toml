[package]
name = "wheelhouse"
version.workspace = true
edition.workspace = true
description = "Wheelhouse: tools for a project's work, as a command line and as a server a host such as Wheel draws a GUI for"

[[bin]]
name = "wheelhouse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml_edit = "0.25"
url = "2"
