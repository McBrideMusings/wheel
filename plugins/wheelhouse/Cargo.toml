[package]
name = "wheelhouse"
version.workspace = true
edition.workspace = true
description = "Wheelhouse: tools for a project's work, as a command line and as a Wheel plugin backend"

[[bin]]
name = "wheelhouse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
toml_edit = "0.25"
url = "2"
async-lsp = { version = "0.2.4", default-features = false, features = ["tokio"] }
json-patch = "5.0.0"
notify = "7.0.0"
tokio-util = { version = "0.7", features = ["compat"] }
