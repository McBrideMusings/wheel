[package]
name = "wheelhouse"
version.workspace = true
edition.workspace = true
description = "Wheelhouse: tools for a project's work, as a command line and as a server a host such as Wheel draws a GUI for"

[[bin]]
name = "wheelhouse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
toml_edit = "0.25"
url = "2"
async-lsp = { version = "0.2.4", default-features = false, features = ["tokio"] }
json-patch = "5.0.0"
notify = "7.0.0"
tokio-util = { version = "0.7", features = ["compat"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "macros", "transport-io"] }
