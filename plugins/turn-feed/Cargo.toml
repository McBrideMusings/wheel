[package]
name = "turn-feed"
version.workspace = true
edition.workspace = true
description = "Turn feed: a feed of posts from agents, one per turn, with options to pick and a reply box; the backend of Wheel's turn-feed plugin"

[[bin]]
name = "turn-feed"
path = "src/main.rs"

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
notify = "7.0.0"
serde_json.workspace = true
tokio.workspace = true
toml_edit = "0.25"
wheel-plugin-sdk = { path = "../../sdk/rust" }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
