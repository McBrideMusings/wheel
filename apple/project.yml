name: Wheel
options:
  bundleIdPrefix: com.piercemakes
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
packages:
  WheelKit:
    path: WheelKit
  WheelUI:
    path: WheelUI
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    from: 2.2.0
  # Renders an agent's Markdown, with its own Prism-based syntax highlighting for code fences.
  # It needs macOS 15, which is why the deployment target above is 15 and not 14.
  textual:
    url: https://github.com/gonzalezreal/textual.git
    # Exact, not `from:`. SwiftPM reads `from: 0.5.0` as up-to-next-major, and a pre-1.0 package
    # promises nothing about breaking in a minor, so that range lets a release change the card.
    exactVersion: 0.5.0
targets:
  Wheel:
    type: application
    platform: macOS
    sources:
      - Mac/Sources
      - Mac/Assets.xcassets
    dependencies:
      - package: WheelKit
      - package: WheelUI
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: textual
        product: Textual
    settings:
      base:
        # tools/install-app.sh dev sets DEV_BUNDLE_SUFFIX=.dev; every other build leaves it empty.
        DEV_BUNDLE_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.piercemakes.wheel$(DEV_BUNDLE_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Wheel
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wheel
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    postBuildScripts:
      - name: Embed wheeld and its launch agent
        script: '"$SRCROOT/Mac/embed-wheeld.sh"'
        basedOnDependencyAnalysis: false
  WheelPhone:
    type: application
    platform: iOS
    sources:
      - iOS/Sources
    dependencies:
      - package: WheelKit
      - package: WheelUI
      - package: libghostty-spm
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piercemakes.wheel.phone
        PRODUCT_NAME: Wheel
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wheel
        INFOPLIST_KEY_NSCameraUsageDescription: Wheel scans the pairing code your Mac shows in Settings > Devices.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
