name: Wheel
options:
  bundleIdPrefix: com.piercemakes
  deploymentTarget:
    macOS: "14.0"
packages:
  WheelKit:
    path: WheelKit
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    from: 2.2.0
targets:
  Wheel:
    type: application
    platform: macOS
    sources:
      - Mac/Sources
      - Mac/Assets.xcassets
    dependencies:
      - package: WheelKit
      - package: libghostty-spm
        product: GhosttyTerminal
    settings:
      base:
        # admin's dev builds set ADMIN_DEV_BUNDLE_SUFFIX=.dev; every other build leaves it empty.
        ADMIN_DEV_BUNDLE_SUFFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.piercemakes.wheel$(ADMIN_DEV_BUNDLE_SUFFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Wheel
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wheel
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    postBuildScripts:
      - name: Embed wheeld and its launch agent
        script: '"$SRCROOT/Mac/embed-wheeld.sh"'
        basedOnDependencyAnalysis: false
