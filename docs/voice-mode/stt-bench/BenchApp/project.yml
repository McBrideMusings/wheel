name: BenchApp
options:
  bundleIdPrefix: com.piercemakes
  deploymentTarget:
    iOS: "18.0"
packages:
  Bench:
    path: ../Bench
targets:
  BenchApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../fixture/clean
        type: folder
        buildPhase: resources
      - path: ../fixture/noisy
        type: folder
        buildPhase: resources
    dependencies:
      - package: Bench
        product: BenchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.piercemakes.sttbench
        DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: STT Bench
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
