[package]
name = "wheel-proto"
version.workspace = true
edition.workspace = true

[dependencies]
base64.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sha2 = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
# The pinned TLS a client reaches a remote wheeld with (`tls::pinned`), and the keepalive
# both ends of a remote link set (`net::keep_alive`).
tls = ["dep:rustls", "dep:sha2", "dep:libc"]
# The pairing code `wheel remote pair` and `wheeld pair` print, and its QR (`pairing`).
pairing = ["dep:qrcode"]
