[package]
name = "wheel-gpui-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wheel_gpui_core"

[dependencies]
anyhow = "1"
base64 = "0.22"
# The version wheeld pins, so a machine compiles Ghostty once for both.
ghostty-vt = "=0.7.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "5.0.0"
futures = "0.3"
libloading = "0.8"
security-framework = "3"
tungstenite = { version = "0.30", features = ["__rustls-tls"] }
wheel-proto = { path = "../../../proto", features = ["tls"] }
regex = "1"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
