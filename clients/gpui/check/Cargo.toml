# The hidden check as its own package, so the workspace's Cargo.toml can compile it unoptimized
# in release builds while the library and the app stay optimized.
[package]
name = "wheel-gpui-check"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wheel-gpui-check"
path = "../src/bin/check.rs"

[dependencies]
wheel-gpui = { path = ".." }
anyhow = "1"
libc = "0.2"
serde_json = "1"
tungstenite = "0.30"
wheel-proto = { path = "../../../proto" }
image = { version = "0.25", default-features = false, features = ["png"] }
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", default-features = false, features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", features = ["font-kit", "test-support"] }
