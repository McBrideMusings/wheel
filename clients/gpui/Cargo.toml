# A Rust and GPUI client for wheeld. Its own workspace, so the daemon's workspace
# and Cargo.lock never pull in GPUI (ADR-0020: the server depends on no client).
[workspace]
members = [".", "check", "core"]
default-members = ["."]

[package]
name = "wheel-gpui"
version = "0.1.0"
edition = "2024"
# src/bin/check.rs belongs to the check/ package; only wheel-gpui.rs is this package's binary.
autobins = false

[lib]
name = "wheel_gpui"

[[bin]]
name = "wheel-gpui"
path = "src/bin/wheel-gpui.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "5.0.0"
futures = "0.3"
raw-window-handle = "0.6"
libloading = "0.8"
tungstenite = "0.30"
wheel-proto = { path = "../../proto" }
wheel-gpui-core = { path = "core" }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
wheel-diagrams = { path = "../../diagrams" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
uuid = { version = "1", features = ["v4"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing"] }
# Speech on this Mac (src/speech): the microphone and the system voice through AVFoundation,
# Parakeet and Silero VAD through sherpa-onnx linked statically (its build downloads the static
# libraries once into ~/Library/Caches/sherpa-rs), and the models' download.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSAttributedString", "NSDictionary", "NSGeometry", "NSObjCRuntime", "NSData", "NSArray", "NSValue", "NSURL", "NSProcessInfo", "NSKeyValueCoding"] }
# AppKit from Rust (src/appkit): the menu bar item and the Dock tile, with typed calls (ADR-0056).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSMenu", "NSMenuItem", "NSEvent", "NSDockTile", "NSWindow", "NSScreen", "NSGraphics", "NSGraphicsContext", "NSBezierPath", "NSColor", "NSFont", "NSFontDescriptor", "NSStringDrawing", "NSAttributedString", "NSAccessibilityProtocols", "NSCell", "NSButtonCell", "NSActionCell", "NSUserInterfaceItemIdentification", "NSAlert", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSCIImageRep", "NSColorSpace", "objc2-core-image"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CIFilter", "CIImage"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "objc2-core-audio-types", "AVAudioApplication", "AVAudioBuffer", "AVAudioConverter", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioMixerNode", "AVAudioMixing", "AVAudioNode", "AVAudioPlayerNode", "AVAudioTime", "AVAudioTypes", "AVSpeechSynthesis"] }
block2 = "0.6"
sherpa-rs = { version = "=0.6.8", default-features = false, features = ["download-binaries", "static"] }
ureq = "3"
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", default-features = false, features = ["test-support"] }
gpui-component = { path = "vendor/gpui-component", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", features = ["font-kit", "test-support"] }

# The same profiles as the daemon's workspace (../../Cargo.toml), which this workspace does not
# inherit: debug builds keep line tables but not variable debug info, and release builds reuse the
# code generated for what did not change.
[profile.dev]
debug = "line-tables-only"

[profile.release]
incremental = true

# The hidden check (check/) is glue around the optimized library, so LLVM does not optimize it:
# check.rs is one file of about 5,600 lines and its release compile runs on one core.
[profile.release.package.wheel-gpui-check]
opt-level = 0

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[patch."https://github.com/zed-industries/zed.git"]
gpui_macos = { path = "vendor/gpui_macos" }
