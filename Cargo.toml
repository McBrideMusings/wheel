[workspace]
resolver = "2"
members = ["proto", "daemon", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Debug builds keep line tables (backtraces, line breakpoints) but not variable debug info, and
# write no per-object debug files: on macOS the default leaves one .o file per codegen unit in
# target/debug/deps, which is most of a worktree's target/ directory.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"

# make deploy-client rebuilds the release wheeld and wheel after every change. Incremental
# compilation reuses the code generated for what did not change: a one-line daemon edit rebuilds
# in about a tenth of the time. Ghostty's terminal code is Zig, built by its own optimizer.
[profile.release]
incremental = true
