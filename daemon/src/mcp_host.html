<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; font: 13px -apple-system, system-ui, sans-serif; }
  #root { height: 100%; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: transparent; }
  #tools { display: flex; height: 100%; }
  #list { width: 200px; flex: none; overflow-y: auto; padding: 8px; border-right: 1px solid rgba(128,128,128,.3); display: flex; flex-direction: column; gap: 2px; }
  #list button { text-align: left; font: 12px ui-monospace, monospace; padding: 5px 8px; border: 0; border-radius: 5px; background: none; color: inherit; cursor: default; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list button:hover { background: rgba(128,128,128,.15); }
  #list button.on { background: rgba(10,132,255,.25); }
  #detail { flex: 1; min-width: 0; overflow-y: auto; padding: 16px; }
  #detail h1 { font: 600 15px ui-monospace, monospace; margin: 0 0 4px; }
  #detail .desc, #detail .hint, #detail small { opacity: .65; }
  #detail .desc { margin: 0 0 12px; }
  #detail form { display: flex; flex-direction: column; gap: 10px; max-width: 480px; }
  #detail label { display: flex; flex-direction: column; gap: 3px; }
  #detail label .name { font: 600 12px ui-monospace, monospace; }
  #detail input[type=text], #detail input[type=number], #detail select, #detail textarea { font: inherit; padding: 4px 6px; }
  #detail textarea { font-family: ui-monospace, monospace; }
  #detail form button { align-self: flex-start; padding: 4px 14px; }
  #detail .status { color: #c0392b; margin: 8px 0 0; }
  #detail .result { margin-top: 12px; border-left: 3px solid rgba(128,128,128,.4); padding-left: 10px; }
  #detail .result.bad { border-color: #c0392b; }
  #detail pre { margin: 0 0 8px; font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  #detail img { max-width: 100%; }
  #error { padding: 16px; color: #c0392b; white-space: pre-wrap; }
</style>
<div id="root"></div>
<script>
// The host half of MCP Apps (SEP-1865, spec 2026-01-26). The server's ui:// page runs in an
// iframe sandboxed to `allow-scripts` alone: no `allow-same-origin`, so the frame has an opaque
// origin and can reach neither this page, `window.wheel`, nor the daemon's cookie. Everything the
// frame does goes through the JSON-RPC messages handled below, and the daemon relays only
// `tools/call` and `resources/read` to the server.
(() => {
  const PROTOCOL = "2026-01-26";
  const base = location.pathname.replace(/[^/]*$/, "") + ".wheel/mcp/";
  const root = document.getElementById("root");

  async function api(path, body) {
    const response = await fetch(base + path, body === undefined ? {} : {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!response.ok) throw new Error((await response.text()) || response.status + "");
    return response.json();
  }

  function fail(message) {
    root.replaceChildren();
    const box = document.createElement("div");
    box.id = "error";
    box.textContent = message;
    root.append(box);
  }

  const el = (tag, props, ...kids) => {
    const node = Object.assign(document.createElement(tag), props || {});
    node.append(...kids.filter((k) => k != null));
    return node;
  };

  // A form field for one property of a tool's input schema. `read()` returns the value to send,
  // `undefined` to leave it out, and throws a message the form shows when the text is not valid.
  function field(name, schema, required) {
    schema = schema || {};
    const types = [].concat(schema.type || []);
    const type = types.find((t) => t !== "null") || (schema.enum ? "string" : "json");
    let input, read;
    if (Array.isArray(schema.enum)) {
      input = el("select");
      if (!required) input.append(el("option", { value: "", textContent: "" }));
      schema.enum.forEach((v, i) => input.append(el("option", { value: String(i), textContent: String(v) })));
      if (schema.default !== undefined) input.value = String(schema.enum.indexOf(schema.default));
      read = () => (input.value === "" ? undefined : schema.enum[Number(input.value)]);
    } else if (type === "boolean") {
      input = el("input", { type: "checkbox", checked: schema.default === true });
      read = () => input.checked;
    } else if (type === "integer" || type === "number") {
      input = el("input", { type: "number", step: type === "integer" ? "1" : "any" });
      if (schema.default !== undefined) input.value = schema.default;
      read = () => (input.value === "" ? undefined : Number(input.value));
    } else if (type === "string") {
      input = el("input", { type: "text" });
      if (schema.default !== undefined) input.value = schema.default;
      read = () => (input.value === "" ? undefined : input.value);
    } else {
      // An object, an array or a schema with no single type: JSON the person types.
      input = el("textarea", { rows: 3, spellcheck: false });
      if (schema.default !== undefined) input.value = JSON.stringify(schema.default);
      read = () => {
        if (input.value.trim() === "") return undefined;
        try { return JSON.parse(input.value); } catch (e) { throw new Error(name + " is not valid JSON"); }
      };
    }
    const label = el("label", null,
      el("span", { className: "name", textContent: name + (required ? " *" : "") }),
      input,
      schema.description ? el("small", { textContent: schema.description }) : null);
    return { label, read: () => {
      const value = read();
      if (value === undefined && required) throw new Error(name + " is required");
      return value;
    } };
  }

  function resultBlocks(result) {
    const out = el("div", { className: "result" + (result.is_error ? " bad" : "") });
    for (const block of result.content || []) {
      if (block.type === "text") out.append(el("pre", { textContent: block.text }));
      else if (block.type === "image" && /^image\/(png|jpeg|gif|webp)$/.test(block.mimeType || "")) {
        out.append(el("img", { src: "data:" + block.mimeType + ";base64," + block.data }));
      } else out.append(el("pre", { textContent: JSON.stringify(block, null, 2) }));
    }
    if (result.structured != null) out.append(el("pre", { className: "structured", textContent: JSON.stringify(result.structured, null, 2) }));
    if (!out.children.length) out.append(el("pre", { textContent: result.is_error ? "The tool failed with no message." : "The tool returned nothing." }));
    return out;
  }

  // Server-supplied text goes in as text, never as markup.
  function showTools(tools) {
    const list = el("nav", { id: "list" });
    const detail = el("main", { id: "detail" }, el("p", { className: "hint", textContent: tools.length ? "Choose a tool." : "This server offers no tools and no interface." }));
    root.replaceChildren(el("div", { id: "tools" }, list, detail));
    const buttons = [];

    function open(tool, button) {
      buttons.forEach((b) => b.classList.toggle("on", b === button));
      const schema = tool.inputSchema || {};
      const required = new Set(schema.required || []);
      const fields = Object.entries(schema.properties || {}).map(([n, s]) => [n, field(n, s, required.has(n))]);
      const output = el("div", { className: "output" });
      const status = el("p", { className: "status" });
      const run = el("button", { type: "submit", textContent: "Run" });
      const form = el("form", null, ...(fields.length ? fields.map(([, f]) => f.label) : [el("p", { className: "hint", textContent: "No arguments." })]), run);
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        output.replaceChildren();
        const args = {};
        try {
          for (const [n, f] of fields) {
            const v = f.read();
            if (v !== undefined) args[n] = v;
          }
        } catch (e) {
          status.textContent = e.message;
          return;
        }
        run.disabled = true;
        status.textContent = "Running…";
        try {
          output.replaceChildren(resultBlocks(await api("call", { tool: tool.name, arguments: args, person: true })));
          status.textContent = "";
        } catch (e) {
          status.textContent = String(e.message || e);
        } finally {
          run.disabled = false;
        }
      });
      detail.replaceChildren(
        el("h1", { textContent: tool.title || tool.name }),
        tool.description ? el("p", { className: "desc", textContent: tool.description }) : null,
        form, status, output);
    }

    for (const tool of tools) {
      const button = el("button", { type: "button", textContent: tool.name, title: tool.description || "" });
      button.addEventListener("click", () => open(tool, button));
      buttons.push(button);
      list.append(button);
    }
    if (tools.length === 1) buttons[0].click();
  }

  // The Content-Security-Policy the resource's `_meta.ui.csp` allows; with none, the page
  // can load and connect to nothing outside itself.
  function policy(csp) {
    csp = csp || {};
    // Only an origin, with at most a leading `*.` on the host, is let into the policy: never `*`,
    // a bare scheme, or anything that could end the directive.
    const origin = /^(https?|wss?):\/\/(\*\.)?[A-Za-z0-9.-]+(:\d+)?$/;
    const list = (a) => (Array.isArray(a) ? a.filter((s) => typeof s === "string" && origin.test(s)) : []);
    const resources = list(csp.resourceDomains).join(" ");
    const connect = list(csp.connectDomains).join(" ");
    const frames = list(csp.frameDomains).join(" ");
    const bases = list(csp.baseUriDomains).join(" ");
    return [
      "default-src 'none'",
      "script-src 'unsafe-inline' 'unsafe-eval' " + resources,
      "style-src 'unsafe-inline' " + resources,
      "img-src data: blob: " + resources,
      "font-src data: " + resources,
      "media-src data: blob: " + resources,
      "connect-src " + (connect || "'none'"),
      "frame-src " + (frames || "'none'"),
      "object-src 'none'",
      "form-action 'none'",
      "base-uri " + (bases || "'self'"),
    ].join("; ");
  }

  function htmlOf(resource) {
    if (typeof resource.text === "string") return resource.text;
    if (typeof resource.blob === "string") {
      const bytes = Uint8Array.from(atob(resource.blob), (c) => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }
    throw new Error("the UI resource has neither text nor blob");
  }

  function showView(view) {
    const resource = view.resource;
    const ui = (resource._meta && resource._meta.ui) || {};
    const meta = document.createElement("meta");
    meta.httpEquiv = "Content-Security-Policy";
    meta.content = policy(ui.csp);
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    // The policy goes after the page's doctype, which must stay first for standards mode.
    const html = htmlOf(resource);
    const doctype = /^\s*<!doctype[^>]*>/i.exec(html);
    const at = doctype ? doctype[0].length : 0;
    frame.srcdoc = html.slice(0, at) + meta.outerHTML + html.slice(at);
    root.replaceChildren(frame);

    const send = (message) => frame.contentWindow.postMessage({ jsonrpc: "2.0", ...message }, "*");
    const reply = (id, result) => send({ id, result });
    const refuse = (id, code, message) => send({ id, error: { code, message } });
    const tool = view.tool;
    const scheme = matchMedia("(prefers-color-scheme: dark)");

    const result = (r) => ({
      content: r.content,
      ...(r.structured != null ? { structuredContent: r.structured } : {}),
      ...(r.is_error ? { isError: true } : {}),
    });

    // The tool that links the view runs once the view says it is ready, with no arguments: no
    // agent is composing a call here.
    async function start() {
      send({ method: "ui/notifications/tool-input", params: { arguments: {} } });
      if (!tool) return;
      try {
        send({ method: "ui/notifications/tool-result", params: result(await api("call", { tool: tool.name, arguments: {}, initial: true })) });
      } catch (e) {
        send({ method: "ui/notifications/tool-result", params: { isError: true, content: [{ type: "text", text: String(e.message || e) }] } });
      }
    }

    async function handle(message) {
      const { id, method, params } = message;
      const isRequest = id !== undefined && method !== undefined;
      try {
        switch (method) {
          case "ui/initialize":
          case "initialize":
            return reply(id, {
              protocolVersion: PROTOCOL,
              hostInfo: { name: "wheel", version: "1" },
              hostCapabilities: { serverTools: {}, serverResources: {}, logging: {} },
              hostContext: {
                ...(tool ? { toolInfo: { tool } } : {}),
                theme: scheme.matches ? "dark" : "light",
                displayMode: "inline",
                availableDisplayModes: ["inline"],
                platform: "desktop",
                locale: navigator.language,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                userAgent: "wheel",
              },
            });
          case "ui/notifications/initialized":
            return start();
          case "ping":
            return reply(id, {});
          case "tools/call":
            return reply(id, result(await api("call", { tool: params.name, arguments: params.arguments || {} })));
          case "resources/read":
            return reply(id, await api("read", { uri: params.uri }));
          case "notifications/message":
            return console.log("mcp app:", JSON.stringify(params));
          case "ui/notifications/size-changed":
            return;
          default:
            if (isRequest) refuse(id, -32601, "this host does not support " + method);
        }
      } catch (e) {
        if (isRequest) refuse(id, -32000, String(e.message || e));
      }
    }

    addEventListener("message", (event) => {
      if (event.source === frame.contentWindow && event.data && event.data.jsonrpc === "2.0") handle(event.data);
    });
  }

  api("view").then(
    ({ tools, view }) => (view ? showView(view) : showTools(tools)),
    (e) => fail(String(e.message || e)),
  );
})();
</script>
