[package]
name = "wheeld"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wheeld"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
h2 = "0.4"
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
webpki-roots = "1"
libc = "0.2"
mime_guess = "2.0.5"
notify = "7.0.0"
ghostty-vt = "=0.7.0"
portable-pty = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
regex-syntax = "0.8"
serde.workspace = true
serde_json.workspace = true
url = "2"
sha2 = "0.10"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "1"
toml_edit = "0.25"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = "3"
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
wheel-proto = { path = "../proto" }
similar = "3.2.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.28"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
