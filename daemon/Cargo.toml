[package]
name = "wheeld"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wheeld"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "3.3.0", features = ["process", "stdio"] }
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
mime_guess = "2.0.5"
notify = "7.0.0"
ghostty-vt = "=0.7.0"
portable-pty = "0.9"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server", "server", "macros"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
toml_edit = "0.25"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = "3"
wheel-proto = { path = "../proto" }

[dev-dependencies]
tokio-tungstenite = "0.28"
