[package]
name = "wheeld"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wheeld"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-lsp = { version = "0.2.4", default-features = false, features = ["tokio"] }
wheel-plugin-sdk = { path = "../sdk/rust" }
wheel-diagrams = { path = "../diagrams", features = ["png"] }
json-patch = "5.0.0"
base64.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
h2 = "0.4"
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ring = "0.17"
webpki-roots = "1"
libc = "0.2"
fsevent-sys = "4.1.0"
tower-http = { version = "0.6", features = ["fs"] }
notify = "7.0.0"
ghostty-vt = "=0.7.0"
portable-pty = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
regex-syntax = "0.8"
serde.workspace = true
serde_json.workspace = true
url = "2"
sha2 = "0.10"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io", "rt", "compat"] }
toml = "1"
toml_edit = "0.25"
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
ureq = "3"
wheel-proto = { path = "../proto", features = ["tls"] }
similar = "3.2.0"
tokio-tungstenite = "0.28"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
